name: Send daily reels scripts via email

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*-scripts.md'
  workflow_dispatch:
    inputs:
      file:
        description: "Script file path (e.g. scripts/2026-04-24-scripts.md)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve script file
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILE="${{ github.event.inputs.file }}"
          else
            FILE=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'scripts/*-scripts.md' | tail -n 1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            FILE=$(ls -1 scripts/*-scripts.md 2>/dev/null | sort | tail -n 1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No script file found. Exiting."
            exit 0
          fi
          DATE=$(basename "$FILE" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || echo "$(date -u +%Y-%m-%d)")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Send email via Resend
        if: steps.resolve.outputs.file != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FILE: ${{ steps.resolve.outputs.file }}
          DATE: ${{ steps.resolve.outputs.date }}
        run: |
          python3 <<'PY'
          import os, json, urllib.request, urllib.error, sys
          file_path = os.environ["FILE"]
          date = os.environ["DATE"]
          api_key = os.environ["RESEND_API_KEY"]
          with open(file_path, encoding="utf-8") as f:
              body = f.read()
          body += "\n\n— Generado automáticamente (GitHub Actions + Resend). Editá los guiones antes de grabar."
          payload = {
              "from": "juanseai <juan@byleonardi.com>",
              "to": ["jolveira@udesa.edu.ar"],
              "subject": f"[juanseai] 3 guiones del día · {date}",
              "text": body,
          }
          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "juanseai-reels-scripts/1.0 (+github-actions)",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print("RESEND OK:", resp.status, resp.read().decode())
          except urllib.error.HTTPError as e:
              print("RESEND FAIL:", e.code, e.read().decode())
              sys.exit(1)
          PY
